<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Accueil</title>
</head>
<body>

    <header class="bg-secondary d-flex align-items-center justify-content-between pe-5">
        <a href="."><img src="img/logo.png" alt="logo" class="img-fluid w-75"></a>
        <nav>
            <a href="index.html" class="text-light mx-2">Accueil</a>
            <a href="inscription.html" class="text-light mx-2">Inscription</a>
            <a href="connexion.html" class="text-light mx-2">Connexion</a>
            <a href="users.html" class="text-light mx-2">Users</a>
        </nav>
    </header>

    <main class="container-fluid p-4">
        <h1>Connexion</h1>

        <form action="">
            <div class="mb-3">
                <label for="">Email</label>
                <input type="email" class="form-control">
            </div>
            <div class="mb-3">
                <label for="">Mot de passe</label>
                <input type="password" class="form-control">
            </div>
            <input type="submit" class="btn btn-outline-success">
        </form>

        <p class="mt-3">
            Pas de compte ? → <a href="inscription.html">Inscription</a>
        </p>
    </main>
    
    <footer class="bg-secondary p-4 mt-5 text-light">
        <em>Auth Starter</em> : &copy; 2026 - Mention - Contact
    </footer>

    <script src="js/localStorage.js"></script>

    <script>
        let form = document.querySelector("form");

        form.addEventListener("submit", (e) => {
            e.preventDefault();

            let tabUsers = read("user");

            let email = document.querySelector("input[type='email']").value
            let mdp = document.querySelector("input[type='password']").value

            if( tabUsers.some(u => (u.email == email && u.mdp == mdp) ) ){
                alert("OK")
            }else{
                alert("ko");
            }
        });
    </script>
    
</body>
</html>
