<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Jeux de Bille</title>
</head>
<body>

    <h1 class="text-center">Jeux de Billes</h1>
    <main class="container-fluid">
        <form action="">
            <div class="d-flex justify-content-around">
                <div class="d-flex">
                    <div class="mb-3 p-2">
                        <label for="">Prénom Joueur 1</label>
                        <input type="text" id="pj1" class="form-control" value="Loan">
                        <div class="errMsg alert-danger mt-1 p-1" id="errPJ1"></div>
                    </div>
                    <div class="mb-3 p-2">
                        <label for="">Nom Joueur 1</label>
                        <input type="text" id="nj1" class="form-control" value="Gass">
                        <div class="errMsg alert-danger mt-1 p-1" id="errNJ1"></div>
                    </div>
                </div>
                <div class="d-flex">
                    <div class="mb-3 p-2">
                        <label for="">Prénom Joueur 2</label>
                        <input type="text" id="pj2" class="form-control" value="Chems">
                        <div class="errMsg alert-danger mt-1 p-1" id="errPJ2"></div>
                    </div>
                    <div class="mb-3 p-2">
                        <label for="">Nom Joueur 2</label>
                        <input type="text" id="nj2" class="form-control" value="Chemseddine">
                        <div class="errMsg alert-danger mt-1 p-1" id="errNJ2"></div>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label for="">Nombre de Bille</label>
                <input type="range" class="form-control" id="nbBille" min="10" max="50" step="1">
            </div>

            <input type="submit" class="btn btn-success">
        </form>

        <div class="card my-5 p-4 text-center d-none" id="jeu">
            <div class="card text-center fs-3" id="bille"></div>
            <div class="d-flex justify-content-evenly my-3">
                <span id="precedent">Coup précédent : 0</span>
                <span id="reste">Billes restantes : 10</span>
            </div>
            <div><strong id="actif">Toto </strong> à toi de jouer</div>

            <div class="d-flex gap-3 mt-3 justify-content-center">
                <button class="btn btn-success">1</button>
                <button class="btn btn-success">2</button>
                <button class="btn btn-success">3</button>
            </div>
        </div>

        <div class="card my-5 p-4 text-center d-none" id="end">
            <div class="fs-3">
                Fin du jeu ! Le joueur <strong id="winner"></strong> a gangé cette partie 🎮🏆
            </div>
            <div class="d-flex justify-content-evenly mt-3">
                <div id="j1"> </div>
                <div id="j2"> </div>
            </div>
        </div>


    </main>

    <script src="script.js"></script>
    
</body>
</html>
